[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgepilot"
version = "0.4.0"
description = "Research tooling for autonomous software engineering agents"
requires-python = ">=3.11"

[project.optional-dependencies]
analysis = ["pandas>=2", "matplotlib>=3.8"]
dev = ["pytest>=8", "pandas>=2", "matplotlib>=3.8"]

[project.scripts]
forgepilot = "forgepilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
forgepilot = ["benchmarks/tasks/*.json"]
